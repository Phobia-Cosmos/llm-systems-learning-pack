[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "miniagent"
version = "0.1.0"
description = "Evidence-first LLM serving benchmark agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
miniagent = "miniagent.cli:main"

[tool.setuptools]
packages = ["miniagent"]

